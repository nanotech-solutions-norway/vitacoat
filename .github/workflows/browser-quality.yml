name: Browser quality gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install image optimizer
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0

      - name: Build optimized static site
        run: python .github/scripts/build_site.py

      - name: Install pinned browser QA tools
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          google-chrome --version
          npm install --no-save --package-lock=false @lhci/cli@0.15.1 playwright@1.63.0

      - name: Run Chromium interaction acceptance
        run: |
          python -m http.server 4173 --directory _site >/tmp/vitacoat-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          BASE_URL=http://127.0.0.1:4173 node .github/scripts/browser_acceptance.cjs

      - name: Run Lighthouse CI budgets
        run: npx lhci autorun --config=.lighthouserc.cjs

      - name: Summarize Lighthouse results
        if: always()
        run: |
          if [ -f lhci-reports/manifest.json ]; then
            python .github/scripts/lighthouse_summary.py
          fi
