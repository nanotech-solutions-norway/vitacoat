name: Static SEO audit

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/scripts/apply_static_seo_heads.py'
      - '.github/scripts/audit_static_seo.py'
      - '.github/workflows/apply-static-seo-heads.yml'
      - 'sitemap.xml'
      - '**/*.html'
  push:
    branches: [main]
    paths:
      - '.github/scripts/apply_static_seo_heads.py'
      - '.github/scripts/audit_static_seo.py'
      - '.github/workflows/apply-static-seo-heads.yml'
      - 'sitemap.xml'
      - '**/*.html'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-seo-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Apply deterministic SEO metadata in working tree
        run: python .github/scripts/apply_static_seo_heads.py

      - name: Verify checked-in HTML matches SEO map
        run: |
          if ! git diff --exit-code -- '*.html'; then
            echo "Static SEO metadata is out of sync with the canonical SEO map."
            echo "Run python .github/scripts/apply_static_seo_heads.py and commit the resulting HTML changes."
            exit 1
          fi

      - name: Audit static SEO coverage against sitemap
        run: python .github/scripts/audit_static_seo.py

# Governance: validation is read-only. SEO metadata changes must arrive through normal branch/PR review.
