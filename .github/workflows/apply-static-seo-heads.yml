name: Static SEO audit

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/scripts/apply_static_seo_heads.py'
      - '.github/scripts/audit_static_seo.py'
      - '.github/workflows/apply-static-seo-heads.yml'
      - 'sitemap.xml'
      - '**/*.html'
  push:
    branches: [main]
    paths:
      - '.github/scripts/apply_static_seo_heads.py'
      - '.github/scripts/audit_static_seo.py'
      - '.github/workflows/apply-static-seo-heads.yml'
      - 'sitemap.xml'
      - '**/*.html'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-seo-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Audit static SEO coverage against sitemap
        run: python .github/scripts/audit_static_seo.py

# Governance: validation is read-only. The generator is a maintainer helper only.
# Metadata changes must arrive through normal branch/PR review.
