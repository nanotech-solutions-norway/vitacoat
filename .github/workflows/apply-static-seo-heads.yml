name: Apply static SEO heads

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/apply_static_seo_heads.py'
      - '.github/scripts/audit_static_seo.py'
      - '.github/workflows/apply-static-seo-heads.yml'
      - 'sitemap.xml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-static-seo-heads:
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'github-actions[bot]' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true # Temporary exception: required by the direct auto-commit workflow; migrate to PR-based write-back.

      - name: Confirm active commit and download-center SEO map
        run: |
          echo "Checked out commit: $(git rev-parse HEAD)"
          grep -n '"/technical-support/downloads/"' .github/scripts/apply_static_seo_heads.py
          grep -n '"/en/technical-support/downloads/"' .github/scripts/apply_static_seo_heads.py

      - name: Apply static SEO metadata to HTML files
        run: python .github/scripts/apply_static_seo_heads.py

      - name: Audit static SEO coverage against sitemap
        run: python .github/scripts/audit_static_seo.py

      - name: Commit static SEO head changes and audit report
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          commit_message: 'Apply and audit static VitaCoat SEO heads'
          file_pattern: '*.html **/*.html seo-static-audit.json'

# Governance note: this workflow exists to make crawler-visible metadata static, deterministic, audited, and version controlled.
# Security exception: direct write-back is retained temporarily for compatibility. Replace with a PR-based bot flow before enforcing a strict no-direct-write main ruleset.
